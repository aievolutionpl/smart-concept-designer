<!doctype html><html><head><meta charset="utf-8"><title>CC0 performance fixture</title><style>body{margin:0}#viewport{width:100vw;height:100vh}</style></head><body><div id="viewport"></div><script type="module">
import {GardenScene} from '/src/scene.js';
const engine=new GardenScene(document.querySelector('#viewport'),{select:()=>{},beforeChange:()=>{},changed:()=>{},live:()=>{},renderer:()=>{},fps:()=>{}});
await engine.init();engine.setEnvironment('empty',20,16);engine.sun.castShadow=false;
const catalog=(await(await fetch('/assets.json')).json()).assets;
const fern=catalog.find(a=>a.vegetation);fern.url=fern.path;
window.fixture={engine,catalog,fern,add:async count=>{for(let i=0;i<count;i++)await engine.add({id:`fern-${i}`,x:(i%6)*2-5,z:Math.floor(i/6)*2-4,rotation:i*23,scale:1},fern);},metrics:()=>({calls:engine.renderStats?.calls,triangles:engine.renderStats?.triangles,...engine.vegetation.stats()})};
window.fixtureReady=true;
</script></body></html>
