<!doctype html><html><head><meta charset="UTF-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7ddd8}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import {createFurniture} from '../src/furniture.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#d7ddd8');
const model=createFurniture(new URLSearchParams(location.search).get('id'));scene.add(model);
const bounds=new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3());
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,30);camera.position.copy(center).add(new THREE.Vector3(1.65,1.3,2.1));camera.lookAt(center);
scene.add(new THREE.HemisphereLight('#ffffff','#8a9882',2.5));const sun=new THREE.DirectionalLight('#fff4df',3);sun.position.set(-3,6,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:'#c1cdc5',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.008;floor.receiveShadow=true;scene.add(floor);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);renderer.render(scene,camera);window.previewReady=true;
</script></body></html>
